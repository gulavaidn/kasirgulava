function inPer(t){var n=new Date(),d=dk(t);
 if(per==='today')return d===dk(n);
 if(per==='7')return t>=new Date(n.getFullYear(),n.getMonth(),n.getDate()-6).getTime();
 if(per==='month')return d.slice(0,7)===dk(n).slice(0,7);return true}
function calc(){
 var S=db.sales.filter(function(s){return inPer(s.t)}),E=db.exp.filter(function(e){return inPer(e.t)});
 var o=0,h=0,x=0,items={},pay={},ec={},days={};
 S.forEach(function(s){o+=s.total;h+=s.cost;if(s.pay==='Gabungan'){pay.Tunai=(pay.Tunai||0)+(s.pc||0);pay.QRIS=(pay.QRIS||0)+(s.pq||0)}else pay[s.pay]=(pay[s.pay]||0)+s.total;var d=dk(s.t);days[d]=(days[d]||0)+s.total;s.items.forEach(function(i){var r=items[i.n]||(items[i.n]={q:0,o:0});r.q+=i.q;r.o+=i.p*i.q})});
 E.forEach(function(e){x+=e.a;ec[e.c]=(ec[e.c]||0)+e.a});
 return{S:S,E:E,o:o,h:h,x:x,gp:o-h,np:o-h-x,items:items,pay:pay,ec:ec,days:days}}
